timezone: Europe/Moscow
dmami:
  group: 231-363
  enabled: true
  auto_generate_schedule: true
  auto_generate_on_start: false
  lookahead_weeks: 8
  scan_weeks: 8
notify:
  on_start_summary: true
  daily_summary: true
  daily_summary_hour: 7
  daily_summary_minute: 0
  allowed_user_ids:
  - 517738418
system:
  require_ac_power: true
  keep_awake: true
chromium:
  headless: false
  executable_path: C:\Program Files\Google\Chrome\Application\chrome.exe
  use_fake_media: true
  extra_args:
  - --use-fake-device-for-media-stream
  - --use-fake-ui-for-media-stream
  - --use-file-for-fake-video-capture=assets\black.y4m
  - --use-file-for-fake-audio-capture=assets\silence.wav
  - --autoplay-policy=no-user-gesture-required
healthcheck:
  every_minutes: 5
  fail_threshold: 2
  indicators:
  - type: selector_exists
    value: button[aria-label*="Покинуть" i], [role="button"][aria-label*="Покинуть"
      i], button[aria-label*="Выйти" i], [role="button"][aria-label*="Выйти" i], [aria-label*="Leave"
      i], [aria-label*="End call" i], button[data-testid*="Microphone" i], button[data-testid*="Camera"
      i], button[data-testid*="ScreenSharingButton" i], [aria-label*="микроф" i],
      [aria-label*="камер" i], [aria-label*="поднять руку" i], [aria-label*="raise
      hand" i]
  - type: selector_exists
    value: div[contenteditable="true"][data-placeholder*="сообщ" i], div[contenteditable="true"][aria-label*="сообщ"
      i], [placeholder*="сообщ" i], [aria-label*="message" i]
  - type: webrtc_active
  - type: websocket_open
default_join:
  steps:
  - action: wait
    selector: '#EventEnterForm'
    timeout_ms: 20000
  - action: click
    selector: '#name'
  - action: fill
    selector: '#name'
    value: Лухнев Олег 231-363
  - action: press
    selector: '#name'
    value: Tab
  - action: wait_any
    selectors:
    - button[data-testid="EventLanding.enter-to-event"]:not([disabled])
    - button[data-testid*="enter-to-event" i]:not([disabled])
    - button[aria-label*="Войти" i]:not([disabled])
    - button[aria-label*="Join" i]:not([disabled])
    timeout_ms: 8000
  - action: click_any
    selectors: &id001
    - button[data-testid="EventLanding.enter-to-event"]
    - button[data-testid*="enter-to-event" i]
    - button[data-testid*="join" i]
    - button[aria-label*="Присоедин" i]
    - button[aria-label*="Войти" i]
    - button[aria-label*="Join" i]
    - button:has-text("Присоединиться к встрече")
    - button:has-text("Войти")
    - button:has-text("Join")
    timeout_ms: 8000
  - action: maybe_click
    selector: button[aria-label*="Выключить микрофон" i]
  - action: maybe_click
    selector: button[aria-label*="Выключить камеру" i]
  - action: click_any
    selectors: *id001
    timeout_ms: 15000
  - action: sleep
    value: 1200
  - action: maybe_click
    selector: button[aria-label*="Выключить микрофон" i]
  - action: maybe_click
    selector: button[aria-label*="Выключить камеру" i]
