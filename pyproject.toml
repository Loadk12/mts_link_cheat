[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nts-autojoin"
version = "0.1.0"
description = "Windows/NSSM service for auto-joining MTS Link meetings"
requires-python = ">=3.10"
dependencies = [
  "playwright==1.47.0",
  "PyYAML>=6.0.1",
  "APScheduler>=3.10.4",
  "python-dateutil>=2.9.0",
  "psutil>=6.0.0",
  "aiohttp>=3.10.5",
  "mss==9.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["nts_autojoin"]
